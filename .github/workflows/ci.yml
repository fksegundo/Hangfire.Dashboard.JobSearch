name: CI Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-core:
    name: Core Unit Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore & Build
      run: |
        dotnet restore Hangfire.Dashboard.JobSearch.slnx
        dotnet build Hangfire.Dashboard.JobSearch.slnx --no-restore --configuration Release
    - name: Test Core
      run: dotnet test tests/Hangfire.Dashboard.JobSearch.Tests/Hangfire.Dashboard.JobSearch.Tests.csproj --no-build --configuration Release --filter "Category!=Redis&Category!=PostgreSql&Category!=SqlServer" --verbosity normal

  test-redis:
    name: Redis Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore & Build
      run: |
        dotnet restore Hangfire.Dashboard.JobSearch.slnx
        dotnet build Hangfire.Dashboard.JobSearch.slnx --no-restore --configuration Release
    - name: Test Redis
      run: dotnet test tests/Hangfire.Dashboard.JobSearch.Tests/Hangfire.Dashboard.JobSearch.Tests.csproj --no-build --configuration Release --filter "Category=Redis" --verbosity normal

  test-postgresql:
    name: PostgreSQL Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore & Build
      run: |
        dotnet restore Hangfire.Dashboard.JobSearch.slnx
        dotnet build Hangfire.Dashboard.JobSearch.slnx --no-restore --configuration Release
    - name: Test PostgreSQL
      run: dotnet test tests/Hangfire.Dashboard.JobSearch.Tests/Hangfire.Dashboard.JobSearch.Tests.csproj --no-build --configuration Release --filter "Category=PostgreSql" --verbosity normal

  test-sqlserver:
    name: SQL Server Integration Tests (Testcontainers)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Restore & Build
      run: |
        dotnet restore Hangfire.Dashboard.JobSearch.slnx
        dotnet build Hangfire.Dashboard.JobSearch.slnx --no-restore --configuration Release
    - name: Test SQL Server
      run: dotnet test tests/Hangfire.Dashboard.JobSearch.Tests/Hangfire.Dashboard.JobSearch.Tests.csproj --no-build --configuration Release --filter "Category=SqlServer" --verbosity normal
