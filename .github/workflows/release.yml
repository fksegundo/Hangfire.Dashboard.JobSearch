name: Release & Publish NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_to_nuget:
        description: 'Publish package to NuGet.org'
        required: true
        type: boolean
        default: false

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Required for GitHub Packages
      id-token: write # Required for NuGet Trusted Publishing (OIDC)

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    - name: Restore dependencies
      run: dotnet restore Hangfire.Dashboard.JobSearch.slnx

    - name: Build
      run: dotnet build Hangfire.Dashboard.JobSearch.slnx --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test Hangfire.Dashboard.JobSearch.slnx --no-build --configuration Release --verbosity normal

    - name: Pack NuGet Package
      run: dotnet pack src/Hangfire.Dashboard.JobSearch/Hangfire.Dashboard.JobSearch.csproj --no-build --configuration Release --output dist

    - name: Upload Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nuget-package
        path: dist/*

    - name: Publish to GitHub Packages
      if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_nuget == true)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet nuget push dist/*.nupkg --api-key "$GITHUB_TOKEN" --source "https://nuget.pkg.github.com/fksegundo/index.json" --skip-duplicate

    - name: NuGet login (Trusted Publishing OIDC)
      if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_nuget == true)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: fksegundo # NuGet.org username

    - name: Publish to NuGet.org
      if: (startsWith(github.ref, 'refs/tags/v') || inputs.publish_to_nuget == true)
      run: |
        dotnet nuget push dist/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
